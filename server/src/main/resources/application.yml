server:
  port: ${SERVER_PORT:8080}

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://shopping-mall-virid.vercel.app}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
